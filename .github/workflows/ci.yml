name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest           # Docker disponible : Testcontainers fonctionne
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw            # le bit exécutable peut manquer quand le dépôt vient de Windows
      # verify = compilation + tous les tests (dont la vérification Spring Modulith et Testcontainers)
      - run: ./mvnw -B verify
