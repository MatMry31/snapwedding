services:
  postgres:
    image: postgres:18
    container_name: snapwedding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-snap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-snap}
      POSTGRES_DB: ${DB_NAME:-snapwedding}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  # Stockage objet compatible S3 : les photos ne vont jamais en base ni sur le disque du serveur
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: snapwedding-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console : http://localhost:9001/rustfs/console/
    volumes:
      - rustfs_data:/data

  # Outil de développement : interface web pour consulter la base (http://localhost:8082)
  # Système : PostgreSQL, Serveur : postgres, Utilisateur / mot de passe / base : ceux du .env
  adminer:
    image: adminer:5.5.1
    container_name: snapwedding-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres   # nom du service PostgreSQL dans le réseau Docker
    ports:
      - "8082:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  rustfs_data:
